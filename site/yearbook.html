<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Yearbook &middot; DeBakey Class of 2016</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Geist:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="yearbook-page">
  <header class="yb-header">
    <a href="./" class="yb-back">&larr; Reunion home</a>
    <h1>2016 Yearbook</h1>
  </header>

  <main class="yb-main">
    <div class="yb-book-wrap">
      <div id="book" class="yb-book">
        <div class="page page-cover" data-density="hard">
          <img src="yearbook/pages/front.webp" alt="Yearbook front cover: From Every Angle">
        </div>
        <!-- yearbook.js inserts the 118 interior pages here -->
        <div class="page page-paper" id="sign-page">
          <form id="sign-form" class="yb-sign-form" novalidate>
            <h2>Sign the yearbook</h2>
            <label for="sign-name">Your name</label>
            <input id="sign-name" name="name" maxlength="60" autocomplete="name" required>
            <label for="sign-message">Message <span class="yb-optional">(optional)</span></label>
            <textarea id="sign-message" name="message" maxlength="280" rows="5"></textarea>
            <button id="sign-submit" class="button" type="submit">Sign</button>
            <p id="sign-status" class="yb-status" role="status" hidden></p>
          </form>
        </div>
        <div class="page page-paper" id="signatures-page">
          <div class="yb-signatures">
            <h2>Signatures</h2>
            <p id="signatures-note" class="yb-note" hidden></p>
            <ol id="signature-list" class="yb-signature-list"></ol>
          </div>
        </div>
        <div class="page page-cover" data-density="hard">
          <img src="yearbook/pages/back.webp" alt="Yearbook back cover">
        </div>
      </div>
    </div>

    <nav class="yb-controls" aria-label="Yearbook pages">
      <button id="prev" class="button button-quiet" type="button" aria-label="Previous page">&lsaquo; Prev</button>
      <span id="page-indicator" class="yb-indicator" aria-live="polite"></span>
      <button id="next" class="button button-quiet" type="button" aria-label="Next page">Next &rsaquo;</button>
      <button id="sign-jump" class="button" type="button">Sign the yearbook</button>
    </nav>
  </main>

  <script src="config.js"></script>
  <script src="vendor/page-flip.browser.js"></script>
  <script src="yearbook.js"></script>
</body>
</html>
