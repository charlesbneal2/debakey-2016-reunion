<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Yearbook &middot; DeBakey Class of 2016</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Geist:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="yearbook-page">
  <header class="yb-header">
    <a href="./" class="yb-back">&larr; Reunion home</a>
    <h1>2016 Yearbook</h1>
  </header>

  <main class="yb-main">
    <div class="yb-book-wrap">
      <div id="book" class="yb-book">
        <div class="page page-cover" data-density="hard">
          <img src="yearbook/pages/front.webp" alt="Yearbook front cover: From Every Angle">
        </div>
        <!-- yearbook.js inserts the 118 interior pages here -->
        <div class="page page-paper page-sign" id="sign-left" title="Open to sign the yearbook"><div class="sheet-mini"></div></div>
        <div class="page page-paper page-sign" id="sign-right" title="Open to sign the yearbook"><div class="sheet-mini"></div></div>
        <div class="page page-cover" data-density="hard">
          <img src="yearbook/pages/back.webp" alt="Yearbook back cover">
        </div>
      </div>
    </div>

    <nav class="yb-controls" aria-label="Yearbook pages">
      <button id="prev" class="button button-quiet" type="button" aria-label="Previous page">&lsaquo; Prev</button>
      <span id="page-indicator" class="yb-indicator" aria-live="polite"></span>
      <button id="next" class="button button-quiet" type="button" aria-label="Next page">Next &rsaquo;</button>
      <button id="sign-jump" class="button" type="button">Sign the yearbook</button>
    </nav>
  </main>

  <div id="signer" class="signer" role="dialog" aria-modal="true" aria-label="Sign the yearbook" hidden>
    <div class="signer-bar">
      <button id="signer-close" class="button button-quiet" type="button">&larr; Back to book</button>
      <p class="signer-hint">Tap anywhere to write. Pinch or scroll to zoom.</p>
      <button id="write-here" class="button" type="button">Write here</button>
    </div>
    <div id="signer-viewport" class="signer-viewport">
      <div id="sheet" class="sheet"></div>
    </div>
    <div id="write-tools" class="signer-tools" hidden>
      <button id="size-down" class="button button-quiet" type="button" aria-label="Smaller text">A&minus;</button>
      <button id="size-up" class="button button-quiet" type="button" aria-label="Bigger text">A+</button>
      <button id="write-cancel" class="button button-quiet" type="button">Cancel</button>
      <button id="write-post" class="button" type="button">Post</button>
    </div>
    <p id="signer-status" class="signer-status" role="status" hidden></p>
  </div>

  <script src="config.js"></script>
  <script src="vendor/page-flip.browser.js"></script>
  <script src="vendor/panzoom.min.js"></script>
  <script src="yearbook.js"></script>
</body>
</html>
