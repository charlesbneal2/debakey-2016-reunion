<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <!-- The URL holds the ticket token, so never send it to other sites. -->
  <meta name="referrer" content="no-referrer">
  <title>Your Ticket | DeBakey Reunion</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body class="page-center">
  <main class="panel">
    <img class="seal-small" src="assets/logo.svg" width="343" height="325" alt="DeBakey High School for Health Professions logo">
    <p class="eyebrow">Class of 2016 &middot; Ten-Year Reunion</p>
    <h1 id="label">Loading your ticket...</h1>
    <img id="qr" class="qr" width="280" height="280" alt="Ticket QR code" hidden>
    <p id="message" class="muted" role="status"></p>
    <p class="event-line">Saturday, November 28, 2026 &middot; 6&ndash;9 PM<br>Eureka Heights Brewery &middot; 941 W 18th St, Houston, TX 77008</p>
    <p class="muted">Questions? Email <a href="mailto:info@debakey2016reunion.com">info@debakey2016reunion.com</a>.</p>
  </main>
  <script src="config.js"></script>
  <script>
    (async () => {
      const label = document.getElementById("label");
      const message = document.getElementById("message");
      const token = new URLSearchParams(window.location.search).get("t") ?? "";
      try {
        const response = await fetch(`${window.FUNCTIONS_URL}/ticket?t=${encodeURIComponent(token)}`);
        if (response.status === 404) {
          label.textContent = "Ticket not found";
          message.textContent = "Check the link in your email.";
          return;
        }
        if (!response.ok) throw new Error(`status ${response.status}`);
        const ticket = await response.json();
        label.textContent = ticket.label;
        if (ticket.voided) {
          message.textContent = "This ticket is no longer valid.";
          return;
        }
        const qr = document.getElementById("qr");
        qr.src = `data:image/png;base64,${ticket.qr_png_base64}`;
        qr.hidden = false;
        message.textContent = "Show this code at the door.";
      } catch {
        label.textContent = "Couldn't load your ticket";
        message.textContent = "Check your connection and try again, or use the QR code in your email.";
      }
    })();
  </script>
</body>
</html>
