name: Keep Supabase awake

# Free Supabase projects pause when idle, which would stop ticket sales.
# Delete this workflow after the reunion.
on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load the guest list, which queries the database
        run: |
          FUNCTIONS_URL=$(grep -oE 'https://[^"]+' site/config.js)
          curl --fail --silent --show-error --output /dev/null "$FUNCTIONS_URL/guest-list"
